<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="browser-nav">
        <div class="nav-arrows">
            <span class="arrow">&#8592;</span>
            <span class="arrow">&#8594;</span>
            <span class="arrow">&#8635;</span>
        </div>
        <div class="url-bar">
            <form action="https://www.google.com/search" method="GET">
                <input type="text" name="q" placeholder="Ask Google or type a URL">
            </form>
        </div>
        <div class="profile-circle">H</div>
    </nav>

    <div class="shortcut">
        <a class = "shortcuts" href="https://www.youtube.com" class="shortcut">YouTube</a>
        <a class = "shortcuts" href="https://leetcode.com" class="shortcut">Leetcode</a>
        <a class = "shortcuts" href="https://github.com" class="shortcut">GitHub</a>
    </div>

    <main>
        <div class="top-right">
            <a href="https://mail.google.com/mail/u/0/">Gmail</a>
            <a href="https://images.google.com/">Images</a>
            <div class="profile-circle2">H</div>
        </div>
        <div class="logo">
            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>
        </div>
        <div class="search-bar">
            <form action="https://www.google.com/search" method="GET">
                <input type="text" placeholder="Search Google or type a URL">
            </form>
        </div>
        <div class="btns">
            <a href="https://gemini.google.com/" class="btn1">AI Search</a>
            <a href="https://gemini.google/overview/image-generation/" class="btn2">Generate Image</a>
           
        </div>
        <a href="https://www.google.com/chrome/web-stories/customize-background-and-theme/" class="cstm_btn"> &#128393; Customize</a>
    </main>
    <footer>
        <div class="footer-top">India</div>
        <div class="footer-bottom">
            <div class="footer-left">
                <a href="https://about.google/">About</a>
                <a href="https://ads.google.com/">Advertising</a>
            </div>
            <div class="footer-right">
                <a href="https://policies.google.com/privacy">Privacy</a>
                <a href="https://policies.google.com/terms">Terms</a>
                <a href="https://www.google.com/preferences">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
